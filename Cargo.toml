[package]
name = "DJICloudSimulation"
version = "0.1.0"
edition = "2021"

[dependencies]
aes-gcm = "0.10"
axum = "0.7"
base64 = "0.22"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
rumqttc = "0.24"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower-http = { version = "0.5", features = ["fs"] }
